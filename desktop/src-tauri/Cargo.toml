[package]
name = "office-vault"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
