# 在 Windows runner 上构建桌面版 exe（与 README 中的本地构建命令一致）
# 产物：desktop/密码保险库.exe（绿色单文件，--no-bundle 跳过安装器）
name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/密码保险库.exe'   # 产物回写仓库不应再次触发构建
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装依赖
        run: npm install

      # cargo 不追踪 ../ui 前端文件，rust-cache 恢复的构建脚本缓存会把旧界面
      # 固化进 exe；清掉最终包的缓存产物强制重新嵌入前端资源
      - name: 清理缓存的最终包产物
        shell: pwsh
        run: cargo clean --release -p office-vault
        working-directory: desktop/src-tauri

      - name: 构建 exe
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle

      - name: 复制为交付文件名
        shell: pwsh
        run: Copy-Item 'src-tauri/target/release/office-vault.exe' '../密码保险库.exe'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/密码保险库.exe
          if-no-files-found: error
