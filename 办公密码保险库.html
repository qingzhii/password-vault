<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>办公保险库</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="%236d8dff" stroke-width="1.8"/><circle cx="12" cy="10.5" r="2.2" stroke="%236d8dff" stroke-width="1.8"/><path d="M12 12.7v3.3" stroke="%236d8dff" stroke-width="1.8" stroke-linecap="round"/></svg>'>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg0:#0a0d13; --bg1:#0f141d; --bg2:#151b27; --bg3:#1b2231; --bg4:#222b3d;
  --line:#232b3d; --line2:#2e3850;
  --tx0:#eef1f8; --tx1:#a9b3c6; --tx2:#737e96;
  --acc:#6d8dff; --acc2:#9a7bff; --accSoft:rgba(109,141,255,.13);
  --ok:#41d392; --warn:#f5b04d; --err:#f47174;
  --r:14px; --rs:9px;
  --sh:0 12px 34px rgba(0,0,0,.4);
  --font:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg0);color:var(--tx0);font-size:14px;overflow:hidden}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#28314a;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--tx0)}
a{color:var(--acc)}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}

/* ============ 通用控件 ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--rs);
  border:1px solid var(--line2);background:var(--bg3);color:var(--tx0);font-size:13.5px;
  transition:background .15s,border-color .15s,transform .06s;user-select:none}
.btn:hover{background:var(--bg4)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;
  box-shadow:0 4px 16px rgba(109,141,255,.32);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--err);border:none;color:#fff;font-weight:600}
.btn.danger-ghost{background:transparent;border-color:transparent;color:var(--err)}
.btn.danger-ghost:hover{background:rgba(244,113,116,.1);border-color:rgba(244,113,116,.3)}
.btn.big{width:100%;justify-content:center;padding:12px;font-size:14.5px;border-radius:11px}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;
  border:none;border-radius:8px;background:transparent;color:var(--tx2);transition:all .14s}
.ibtn:hover{background:var(--bg4);color:var(--tx0)}
.ibtn .ic{width:15.5px;height:15.5px}
.ibtn.fav.on{color:var(--warn)}
.link{background:none;border:none;color:var(--acc);font-size:12.5px;padding:0}
.link:hover{text-decoration:underline}
.input{width:100%;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--line2);
  background:#0c1119;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
textarea.input{resize:vertical;min-height:70px;line-height:1.55}
select.input{appearance:auto;cursor:pointer}
.input-row{display:flex;gap:8px;align-items:center}
.input-row .input{flex:1}
.input-row .pw-input{padding-right:12px}
.flabel{display:block;font-size:12.5px;color:var(--tx1);margin:14px 0 6px;font-weight:600;letter-spacing:.02em}
.mono{font-family:var(--mono)}
.meter{display:flex;align-items:center;gap:4px;margin-top:8px;height:14px}
.meter i{width:22px;height:4px;border-radius:99px;background:var(--bg4);transition:background .2s}
.meter b{font-size:11px;font-weight:600;margin-left:6px;color:var(--tx2)}
.meter.s0 i:nth-child(1){background:var(--err)} .meter.s0 b{color:var(--err)}
.meter.s1 i:nth-child(-n+2){background:var(--warn)} .meter.s1 b{color:var(--warn)}
.meter.s2 i:nth-child(-n+3){background:var(--acc)} .meter.s2 b{color:var(--acc)}
.meter.s3 i:nth-child(-n+4){background:var(--ok)} .meter.s3 b{color:var(--ok)}
.chip{display:inline-block;background:var(--accSoft);color:var(--acc);border-radius:999px;
  padding:2.5px 10px;font-size:11.5px;font-weight:600}

/* ============ 锁屏 ============ */
.lockview{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg0);overflow:hidden;z-index:50}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-a{width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,rgba(59,79,216,.55),transparent 68%);animation:float 14s ease-in-out infinite alternate}
.orb-b{width:560px;height:560px;right:-180px;bottom:-200px;background:radial-gradient(circle,rgba(109,63,208,.5),transparent 68%);animation:float 17s ease-in-out infinite alternate-reverse}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.12)}}
@media (prefers-reduced-motion: reduce){.orb{animation:none}}
.lock-card{position:relative;width:392px;max-width:92vw;background:rgba(19,25,37,.97);
  border:1px solid var(--line2);border-radius:20px;padding:36px 34px 26px;box-shadow:var(--sh);animation:cardIn .35s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.lock-card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock-logo{display:flex;justify-content:center;margin-bottom:14px}
.lock-card h1{font-size:20px;text-align:center;letter-spacing:.04em}
.lock-sub{font-size:12.5px;color:var(--tx1);text-align:center;margin:8px 0 6px;line-height:1.6}
.lock-warn{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--warn);
  background:rgba(245,176,77,.08);border:1px solid rgba(245,176,77,.25);border-radius:10px;
  padding:10px 12px;margin:16px 0 4px;line-height:1.6}
.lock-warn .ic{width:14px;height:14px;margin-top:2px}
.lock-err{font-size:12.5px;color:var(--err);text-align:center;min-height:18px;margin-top:12px}
.lock-foot{font-size:11px;color:var(--tx2);text-align:center;margin-top:20px;letter-spacing:.05em}
.lock-more{text-align:center;margin-top:14px}

/* ============ 主界面布局 ============ */
.appview{display:grid;grid-template-columns:236px minmax(330px,420px) 1fr;height:100vh;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sidebar{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:16px 12px 14px;overflow:hidden}
.sidebar,.list-pane,.detail-pane{min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand-t b{display:block;font-size:15px;letter-spacing:.03em}
.brand-t span{display:block;font-size:10px;color:var(--tx2);letter-spacing:.22em;margin-top:3px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;
  border:none;background:none;color:var(--tx1);font-size:13.5px;text-align:left;transition:all .14s;margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--tx0)}
.nav-item.active{background:var(--accSoft);color:var(--acc);font-weight:600}
.nav-item .ic{width:16px;height:16px}
.nav-item .cnt{margin-left:auto;font-size:11.5px;color:var(--tx2);background:var(--bg3);
  border-radius:99px;padding:1px 8px;min-width:22px;text-align:center}
.nav-item.active .cnt{background:rgba(109,141,255,.18);color:var(--acc)}
.nav-label{font-size:11px;color:var(--tx2);letter-spacing:.14em;margin:16px 12px 7px;font-weight:600}
#navTags{flex:1;min-height:0;overflow-y:auto}
.tag-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 12px;border-radius:9px;border:none;
  background:none;color:var(--tx1);font-size:13px;text-align:left;transition:all .13s}
.tag-item:hover{background:var(--bg3);color:var(--tx0)}
.tag-item.active{background:var(--accSoft);color:var(--acc);font-weight:600}
.tag-item .cnt{margin-left:auto;font-size:11px;color:var(--tx2)}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}

/* ============ 列表栏 ============ */
.list-pane{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.list-head{padding:14px 14px 10px;display:flex;gap:9px;align-items:center}
.search{position:relative;flex:1}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx2);width:15px;height:15px}
.search .input{padding-left:34px;font-size:13px}
.batch-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;row-gap:7px;padding:2px 14px 8px;font-size:12.5px;color:var(--tx1);flex:none}
.batch-bar .btn{flex:none;white-space:nowrap}
.batch-bar>span{white-space:nowrap}
.batch-bar b{color:var(--acc);font-size:14px}
.rowchk{display:flex;align-items:center;flex:none;cursor:pointer}
.rowchk input{width:15px;height:15px;accent-color:var(--acc);pointer-events:none}
.tpl-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.d-banner{display:flex;gap:9px;align-items:flex-start;background:rgba(245,176,77,.08);border:1px solid rgba(245,176,77,.25);
  color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
.d-banner .ic{width:14px;height:14px;margin-top:2px;flex:none}
.entry-row.deleted{opacity:.55}
.chip .ic{width:11px;height:11px;vertical-align:-1.5px}
.chip.grp{background:rgba(65,211,146,.1);color:var(--ok)}
/* 类型页签（密码 | 书签） */
.type-tabs{display:flex;gap:6px;padding:12px 14px 0;flex:none}
.type-tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);
  color:var(--tx1);font-size:13px;font-weight:600;transition:all .15s}
.type-tabs button.active{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
.type-tabs button:hover{color:var(--tx0)}
/* 书签文件夹树 */
.tree-item{display:flex;align-items:center;gap:6px;width:100%;padding:6px 12px;border-radius:9px;border:none;
  background:none;color:var(--tx1);font-size:12.5px;text-align:left;cursor:pointer}
.tree-item:hover{background:var(--bg3);color:var(--tx0)}
.tree-item.active{background:var(--accSoft);color:var(--acc);font-weight:600}
.tree-item .tw{width:13px;flex:none;display:inline-flex;justify-content:center;color:var(--tx2)}
.tree-item .tw .ic{width:11px;height:11px;transition:transform .15s}
.tree-item .tw.open .ic{transform:rotate(90deg)}
.tree-item .tw.empty{visibility:hidden}
.tree-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .cnt{font-size:11px;color:var(--tx2)}
/* 书签上下文条 */
.bm-bar{display:block;padding:2px 14px 8px;font-size:12px;color:var(--tx1);flex:none}
.bm-bar .pth{display:block;font-weight:600;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-bar .sp{display:flex;gap:6px;flex-wrap:wrap}
.entry-list{flex:1;overflow-y:auto;padding:2px 8px 14px}
.entry-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;
  transition:background .12s;margin-bottom:2px;border:1px solid transparent}
.entry-row:hover{background:var(--bg3)}
.entry-row.sel{background:var(--bg3);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--acc)}
.avatar{width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.avatar.big{width:52px;height:52px;border-radius:14px;font-size:20px}
.e-main{flex:1;min-width:0}
.e-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px}
.fav-mark{color:var(--warn);display:inline-flex}
.fav-mark .ic{width:12.5px;height:12.5px}
.e-sub{font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2.5px}
.e-acts{display:none;gap:2px}
.entry-row:hover .e-acts{display:flex}

/* ============ 详情栏 ============ */
.detail-pane{overflow-y:auto;min-width:0}
.d-head{display:flex;align-items:center;gap:14px;padding:24px 26px 18px;border-bottom:1px solid var(--line)}
.d-tt{flex:1;min-width:0}
.d-tt h2{font-size:19px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.d-actions{display:flex;gap:7px;align-items:center;flex:none}
.d-body{padding:10px 26px 26px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:none}
.flabel2{width:86px;flex:none;font-size:12.5px;color:var(--tx2)}
.fval{flex:1;min-width:0;font-size:13.5px;word-break:break-all;line-height:1.5}
.fval .pw-mask{letter-spacing:2px;font-family:var(--mono);color:var(--tx1)}
.fval a{color:var(--acc);text-decoration:none}
.fval a:hover{text-decoration:underline}
.notes-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
  font-size:13px;color:var(--tx1);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.meta-line{display:flex;gap:18px;margin-top:18px;font-size:11.5px;color:var(--tx2)}
.meta-line span{display:inline-flex;align-items:center;gap:5px}
.meta-line .ic{width:12.5px;height:12.5px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--tx2)}
.empty svg{width:64px;height:64px;opacity:.35}
.empty p{font-size:13px;line-height:1.8;text-align:center}
.fav-star-lg{color:var(--warn)}

/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(5,7,11,.72);
  display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;transition:opacity .16s}
.overlay.show{opacity:1}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:17px;box-shadow:var(--sh);
  width:min(520px,93vw);max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(10px) scale(.985);transition:transform .18s}
.overlay.show .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px 0}
.m-title{font-size:15.5px;font-weight:700;letter-spacing:.02em}
.m-body{padding:8px 22px 6px;overflow-y:auto}
.m-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 22px 20px}
.gen-box{background:var(--bg1);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-top:10px}
.gen-out{display:flex;align-items:center;gap:8px;background:#0c1119;border:1px solid var(--line2);
  border-radius:9px;padding:9px 11px}
.gen-out code{flex:1;font-family:var(--mono);font-size:13.5px;word-break:break-all;user-select:all;color:var(--ok)}
.range-row{display:flex;align-items:center;gap:11px;margin:13px 0 9px;font-size:12.5px;color:var(--tx1)}
.range-row input[type=range]{flex:1;accent-color:var(--acc)}
.range-row b{font-family:var(--mono);font-size:13px;color:var(--acc);min-width:26px;text-align:right}
.chk-row{display:flex;flex-wrap:wrap;gap:7px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx1);
  background:var(--bg3);border:1px solid var(--line2);padding:5px 11px;border-radius:999px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);cursor:pointer}
.chk:has(input:checked){border-color:var(--acc);color:var(--tx0);background:var(--accSoft)}
.cf-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.cf-row .cf-name{flex:0 0 34%;min-width:0}
.cf-row .cf-val{flex:1;min-width:0}
.set-group{margin-bottom:6px}
.set-group>.sg-title{font-size:11px;color:var(--tx2);letter-spacing:.14em;font-weight:700;margin:16px 0 4px}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-info{flex:1;min-width:0}
.set-label{font-size:13.5px;font-weight:600}
.set-desc{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.5}
.set-row .input{width:130px;flex:none}
.file-status{font-size:12px;color:var(--tx2);margin:8px 0 0;line-height:1.6;word-break:break-all}
.file-status.ok{color:var(--ok)}

/* ============ Toast ============ */
#toastRoot{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;pointer-events:none}
.toast{background:rgba(27,34,49,.96);border:1px solid var(--line2);border-radius:999px;padding:10px 20px;
  font-size:13px;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;white-space:nowrap;
  animation:toastIn .22s ease}
.toast .ic{width:14.5px;height:14.5px;color:var(--ok)}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* ============ 移动端 / 窄窗口响应式 ============ */
.mbar{display:none}
#drawerBackdrop{position:fixed;inset:0;background:rgba(5,7,11,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.d-back{display:none}
@media (max-width:860px){
  .appview{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .mbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg1);
    border-bottom:1px solid var(--line);flex:none;position:relative;z-index:50}
  .mbar .m-title{flex:1;font-size:14.5px;font-weight:700;letter-spacing:.03em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #drawerBackdrop.show{opacity:1;pointer-events:auto}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(82vw,300px);z-index:60;
    transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--sh)}
  .sidebar.open{transform:none}
  .list-pane{flex:1;min-height:0;border-right:none;width:100%}
  .detail-pane{position:fixed;inset:0;z-index:70;background:var(--bg0);display:none;overflow-y:auto}
  .detail-pane.show{display:block}
  .d-back{display:inline-flex}
  .d-head{flex-wrap:wrap;row-gap:10px}
  .d-head .avatar.big{width:42px;height:42px;font-size:17px;border-radius:12px}
  .d-tt{flex:1 1 calc(100% - 56px)}
  .d-actions{flex-wrap:wrap;gap:7px}
  .d-actions .btn{padding:9px 13px}
  .d-actions .btn.primary{margin-left:auto}
  .d-tt h2{white-space:normal;font-size:17px}
  .d-tags{margin-top:6px}
  .type-tabs{padding-top:10px}
  .btn,.ibtn{min-height:34px}
  .entry-row{padding:10px}
  .frow{padding:13px 0}
  .set-row{flex-wrap:wrap}
  .set-row .btn,.set-row .input{flex:none}
}
@media (max-width:860px) and (hover:none){
  .entry-row:hover{background:transparent}
}
</style>
</head>
<body>

<!-- ======== 锁屏 ======== -->
<div id="lockView" class="lockview">
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <div class="lock-card" id="lockCard"></div>
</div>

<!-- ======== 主界面 ======== -->
<div id="appView" class="appview hidden">
  <div class="mbar">
    <button class="ibtn" id="btnMenu" title="菜单"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="m-title">办公保险库</div>

/* ---------- 密码强度 ---------- */
function pwStrength(pw){
  if(!pw) return {s:-1,label:'',cls:''};
  let pool=0;
  if(/[a-z]/.test(pw)) pool+=26;
  if(/[A-Z]/.test(pw)) pool+=26;
  if(/[0-9]/.test(pw)) pool+=10;
  if(/[^a-zA-Z0-9]/.test(pw)) pool+=33;
  let bits = pw.length * Math.log2(Math.max(pool,2));
  if(/(.)\1{2,}/.test(pw)) bits*=0.8;
  if(/(?:0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf|zxcv|password|admin)/i.test(pw)) bits*=0.7;
  let s = bits<32?0 : bits<50?1 : bits<75?2 : 3;
  if(pw.length<8) s=0;
  const L=['弱','一般','强','极强'], C=['err','warn','acc','ok'];
  return {s, label:L[s], cls:C[s]};
}
function meterHTML(){ return '<div class="meter"><i></i><i></i><i></i><i></i><b></b></div>'; }
function updateMeter(root, pw){

  const r=pwStrength(pw);
  m.className='meter'+(r.s>=0?' s'+r.s:'');
  m.querySelector('b').textContent = r.s>=0 ? ('强度：'+r.label) : '';
}

/* ---------- 密码生成器 ---------- */
const SETS={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower:'abcdefghijklmnopqrstuvwxyz',digits:'0123456789',symbols:'!@#$%^&*()-_=+[]{};:,.<>?/~'};
const AMBIG='Il1O0o';
function genPassword(len,opts){
  let all='';
  if(opts.fmt==='hex'){ all='0123456789abcdef'; }
  else if(opts.fmt==='b64'){ all='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'; }
  else{
    const pools=[];
    for(const k of ['upper','lower','digits','symbols']) if(opts[k]){
      const s=(opts.noAmb? SETS[k].split('').filter(c=>!AMBIG.includes(c)).join('') : SETS[k]);
      if(s) pools.push(s);
    }
    if(!pools.length) return '';
    all=pools.join('');
    const chars=pools.map(p=>p[rand(p.length)]);
    while(chars.length<len) chars.push(all[rand(all.length)]);
    for(let i=chars.length-1;i>0;i--){ const j=rand(i+1); [chars[i],chars[j]]=[chars[j],chars[i]]; }
    return chars.slice(0,len).join('');
  }
  const chars=[];
  while(chars.length<len) chars.push(all[rand(all.length)]);
  return chars.join('');
}

/* ---------- 加密核心 ---------- */
const LS_KEY='office-vault.blob';
const ITERATIONS=600000;
async function deriveKey(password, saltU8, iterations){
  const km=await crypto.subtle.importKey('raw', enc.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

/* ---------- IndexedDB（保存文件句柄用） ---------- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('office-vault',1);
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

/* ---------- 持久化 ---------- */
async function persist(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, state.key, enc.encode(JSON.stringify(state.vault)));
  const env={app:'OfficeVault', v:1, kdf:{algo:'PBKDF2-SHA256', iterations:state.iter},
    salt:state.saltB64, iv:b64e(iv), ct:b64e(new Uint8Array(ct)), updated:new Date().toISOString()};
  localStorage.setItem(LS_KEY, JSON.stringify(env));
  state.blob=env;
  writeFileBestEffort();
}
async function writeFileBestEffort(){
  if(!fileHandle || !state.blob) return;
  try{
    const p=await fileHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted') return;
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(state.blob, null, 2));
    await w.close();
  }catch(e){ /* 文件写入失败不影响本地使用 */ }
}

/* ---------- 剪贴板 ---------- */
async function copyText(text, label){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }
  const sec=state.vault && state.vault.settings.clipClearSec;
  toast(label+'已复制'+(sec?('，'+sec+' 秒后自动清空剪贴板'):''));
  clearTimeout(clipTimer);
  if(sec>0) clipTimer=setTimeout(()=>{ navigator.clipboard.writeText('').catch(()=>{}); }, sec*1000);
}

  clearTimeout(lockTimer);

  const m=state.vault.settings.autoLockMin;
  if(m>0) lockTimer=setTimeout(lockNow, m*60000);

  clearTimeout(lockTimer);

      '<div class="lock-more"><button class="link" id="lnkImport">已有 .vault 备份文件？从文件导入</button></div>'+
      '<div class="lock-err" id="lockErr"></div>'+
      '<div class="lock-foot">AES-256-GCM 加密 · PBKDF2 六十万次迭代 · 无任何网络请求</div>';
    const p1=$('#pw1'), p2=$('#pw2');
    p1.addEventListener('input', ()=>updateMeter(card, p1.value));
    p1.addEventListener('keydown', e=>{ if(e.key==='Enter') p2.focus(); });
    p2.addEventListener('keydown', e=>{ if(e.key==='Enter') doCreate(); });
    $('#btnCreate').onclick=doCreate;
    $('#lnkImport').onclick=()=>pickImportFile(false);
    p1.focus();
  }else{
    /* --- 解锁 --- */
    card.innerHTML=
      '<div class="lock-logo">'+LOGO(52)+'</div>'+
      '<h1>办公保险库</h1>'+
      '<p class="lock-sub">输入主密码解锁'+(state.blob.updated?('　·　上次保存 '+fmtTime(state.blob.updated)):'')+'</p>'+
      '<input class="input pw-input" id="pw0" type="password" placeholder="主密码" autocomplete="current-password" style="margin-top:14px">'+
      '<button class="btn primary big" id="btnUnlock" style="margin-top:16px">解锁</button>'+
      '<div class="lock-err" id="lockErr"></div>'+
      '<div class="lock-foot">AES-256-GCM 加密 · 数据 100% 离线</div>';
    const p0=$('#pw0');
    p0.addEventListener('keydown', e=>{ if(e.key==='Enter') doUnlock(); });
    $('#btnUnlock').onclick=doUnlock;
    p0.focus();
  }
}
async function doCreate(){
  const p1=$('#pw1').value, p2=$('#pw2').value, err=$('#lockErr'), card=$('#lockCard');
  err.textContent='';
  if(p1.length<8){ err.textContent='主密码至少需要 8 位'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); return; }
  if(p1!==p2){ err.textContent='两次输入的密码不一致'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); return; }
  const btn=$('#btnCreate'); btn.disabled=true; btn.textContent='正在加密创建…';
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    state.saltB64=b64e(salt); state.iter=ITERATIONS;
    state.key=await deriveKey(p1, salt, state.iter);
    state.vault={ v:2, entries:[], bookmarks:newBookmarkStore(), settings:{autoLockMin:5, clipClearSec:30}, meta:{createdAt:new Date().toISOString()} };
    await persist();
    enterApp(true);
  }catch(e){
    err.textContent='创建失败：'+e.message;
    btn.disabled=false; btn.textContent='创建保险库';
  }
}
async function doUnlock(){
  const pw=$('#pw0').value, err=$('#lockErr'), card=$('#lockCard'), btn=$('#btnUnlock');
  if(!pw){ err.textContent='请输入主密码'; return; }
  err.textContent=''; btn.disabled=true; btn.textContent='解锁中…';
  try{
    const env=state.blob;
    const salt=b64d(env.salt);
    const key=await deriveKey(pw, salt, env.kdf.iterations);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(env.iv)}, key, b64d(env.ct));
    state.vault=JSON.parse(dec.decode(plain));
    /* vault v2：合并书签库 */
    if(!state.vault.bookmarks || !state.vault.bookmarks.roots) state.vault.bookmarks=newBookmarkStore();
    if(state.vault.v!==2){ state.vault.v=2; state.upgraded=true; }
    state.key=key; state.saltB64=env.salt; state.iter=env.kdf.iterations;
    /* 若绑定了本地文件，趁这次点击的授权窗口恢复写权限 */
    if(fileHandle){
      try{
        if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'
           && await fileHandle.requestPermission({mode:'readwrite'})==='granted'){
          writeFileBestEffort();
        }
      }catch(e){}
    }
    enterApp(false);
  }catch(e){
    err.textContent='主密码错误';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    btn.disabled=false; btn.textContent='解锁';
    $('#pw0').select();
  }
}
function enterApp(isNew){
  state.unlocked=true;
  $('#lockView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  $('#brandLogo').innerHTML=LOGO(30);
  $('#searchIc').innerHTML=ICONS.search;
  $('#navAll').querySelector('.n-ic').innerHTML=ICONS.folder;
  $('#navFav').querySelector('.n-ic').innerHTML=ICONS.star;
  $('#btnSettings').querySelector('.n-ic').innerHTML=ICONS.gear;
  $('#btnLockNow').querySelector('.n-ic').innerHTML=ICONS.lock;
  $('#btnNew').querySelector('.n-ic').innerHTML=ICONS.plus;
  $('#btnBatch').querySelector('.n-ic').innerHTML=ICONS.check;
  $('#navTrash').querySelector('.n-ic').innerHTML=ICONS.trash;
  /* 自动清理回收站：删除超过 30 天的条目彻底移除 */
  let purged=0;
  {
    const cutoff=Date.now()-30*86400000;
    const before=state.vault.entries.length;
    state.vault.entries=state.vault.entries.filter(e=>!(e.deletedAt && new Date(e.deletedAt).getTime()<cutoff));
    purged=before-state.vault.entries.length;
  }
  if(purged){ persist().catch(()=>{}); }
  if(state.upgraded){ state.upgraded=false; persist().catch(()=>{}); toast('保险库已升级到 v2：新增书签区，可在顶部页签切换', 5000); }
  renderAll();
  resetLockTimer();
  if(isNew) toast('保险库已创建。建议到「设置」绑定本地 .vault 文件，防止浏览器数据被清理后丢失', 6500);
}

function allTags(){
  const map=new Map();
  for(const e of state.vault.entries) for(const t of (e.tags||[])) map.set(t,(map.get(t)||0)+1);
  return [...map.entries()].sort((a,b)=>b[1]-a[1]);
}
function visibleEntries(){
  const f=state.filter;
  let arr=state.vault.entries.slice();
  if(f.view==='trash') arr=arr.filter(e=>e.deletedAt);
  else arr=arr.filter(e=>!e.deletedAt);
  if(f.view==='fav') arr=arr.filter(e=>e.favorite);
  if(f.view==='group' && f.tag) arr=arr.filter(e=>(e.group||'')===(f.tag));
  if(f.view==='tag' && f.tag) arr=arr.filter(e=>(e.tags||[]).includes(f.tag));
  if(f.q){
    const q=f.q.toLowerCase();
    arr=arr.filter(e=>[e.title,e.username,e.url,e.notes,(e.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  }
  arr.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0) || (b.updatedAt>a.updatedAt?1:-1));
  return arr;
}

    '<button class="btn small" id="bExitSel">完成</button>'+
    '<span style="margin-left:auto;color:var(--tx2);font-size:11.5px">“全选当前”只选中筛选结果</span>';
  $('#bSelAll').onclick=()=>{ visibleEntries().forEach(x=>state.selectedIds.add(x.id)); renderBatchBar(); renderList(); };
  $('#bDelSel').onclick=batchDelete;
  const sa=$('#bSetAttrs'); if(sa) sa.onclick=batchSetAttrs;
  $('#bExitSel').onclick=()=>{ state.batchMode=false; state.selectedIds.clear(); renderAll(); };
  const rs=$('#bRestoreSel');
  if(rs) rs.onclick=batchRestore;
}
async function batchDelete(){
  if(state.type==='bm') return bmBatchDelete();
  const n=state.selectedIds.size;
  if(!n){ toast('请先勾选要操作的条目'); return; }
  if(state.filter.view==='trash'){
    if(!(await confirmDlg('彻底删除','确定将选中的 '+n+' 条条目彻底删除吗？此操作不可恢复。','彻底删除',true))) return;
    state.vault.entries=state.vault.entries.filter(x=>!state.selectedIds.has(x.id));
    state.selectedIds.clear(); state.batchMode=false; state.selectedId=null;
    await persist(); renderAll();
    toast('已彻底删除 '+n+' 条条目');
  }else{
    if(!(await confirmDlg('移入回收站','将选中的 '+n+' 条条目移入回收站吗？30 天后自动彻底删除。','移入回收站',false))) return;
    const now=new Date().toISOString();
    state.vault.entries.forEach(x=>{ if(state.selectedIds.has(x.id)) x.deletedAt=now; });
    state.selectedIds.clear(); state.batchMode=false; state.selectedId=null;
    await persist(); renderAll();
    toast('已移入回收站 '+n+' 条条目');
  }
}
async function batchRestore(){
  const n=state.selectedIds.size;
  if(!n){ toast('请先勾选要恢复的条目'); return; }
  const now=new Date().toISOString();
  state.vault.entries.forEach(x=>{ if(state.selectedIds.has(x.id)) delete x.deletedAt; });
  state.selectedIds.clear(); state.batchMode=false; state.selectedId=null;
  await persist(); renderAll();
  toast('已恢复 '+n+' 条条目');
}
async function batchSetAttrs(){
  const n=state.selectedIds.size;
  if(!n){ toast('请先勾选要操作的条目'); return; }
  const groups=[...new Set(state.vault.entries.filter(x=>!x.deletedAt&&x.group).map(x=>x.group))];
  const ov=openModal(
    '<div class="m-head"><div class="m-title">批量设置分组与标签</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body">'+
      '<p style="color:var(--tx1);font-size:12.5px;margin:2px 0 4px;line-height:1.7">将应用到选中的 <b style="color:var(--acc)">'+n+'</b> 条条目，留空的部分不会被修改。</p>'+
      '<label class="flabel">分组</label>'+
      '<input class="input" id="bGroup" list="bGroupList" placeholder="如：工作 / 个人 / 项目A" value="">'+
      '<datalist id="bGroupList">'+groups.map(g=>'<option value="'+esc(g)+'">').join('')+'</datalist>'+
      '<label class="chk" style="margin:8px 0 0"><input type="checkbox" id="bGroupClear">清空这些条目的分组</label>'+
      '<label class="flabel">标签</label>'+
      '<input class="input" id="bTags" placeholder="用空格或逗号分隔，如：办公 邮箱" value="">'+
      '<div class="chk-row" style="margin-top:8px">'+
        '<label class="chk"><input type="radio" name="bTagMode" value="add" checked>添加到现有标签</label>'+
        '<label class="chk"><input type="radio" name="bTagMode" value="replace">替换现有标签</label>'+
      '</div>'+
      '<p style="color:var(--tx2);font-size:11.5px;margin-top:6px">替换模式留空即清空标签。</p>'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="bApply">应用</button></div>',
    460);
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  ov.querySelector('#bApply').onclick=async()=>{
    const grp=ov.querySelector('#bGroup').value.trim();
    const clearGrp=ov.querySelector('#bGroupClear').checked;
    const tagsRaw=ov.querySelector('#bTags').value.trim();
    const mode=ov.querySelector('input[name="bTagMode"]:checked').value;
    if(!grp && !clearGrp && !tagsRaw){ toast('没有需要应用的修改'); return; }
    const tags=[...new Set(tagsRaw.split(/[,，、\s]+/).map(t=>t.trim()).filter(Boolean))].slice(0,8);
    const now=new Date().toISOString();
    state.vault.entries.forEach(x=>{
      if(!state.selectedIds.has(x.id)) return;
      if(clearGrp) delete x.group;
      else if(grp) x.group=grp;
      if(tagsRaw){
        x.tags = mode==='replace' ? tags.slice() : [...new Set([...(x.tags||[]), ...tags])].slice(0,8);
      }
      x.updatedAt=now;
    });
    closeModal();
    state.selectedIds.clear(); state.batchMode=false; state.selectedId=null;
    await persist(); renderAll();
    toast('已更新 '+n+' 条条目');
  };
}
$('#searchInput').addEventListener('input', function(){
  if(state.type==='bm') state.bm.q=this.value; else state.filter.q=this.value;
  renderList();
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k' && state.unlocked){ e.preventDefault(); $('#searchInput').focus(); $('#searchInput').select(); }
});
$('#entryList').addEventListener('click', e=>{
  if(state.type==='bm') return bmListClick(e);
  const row=e.target.closest('[data-row]');
  if(!row) return;
  const entry=state.vault.entries.find(x=>x.id===row.dataset.row);
  if(!entry) return;
  if(state.filter.view==='trash' && e.target.closest('[data-act-restore]')){
    delete entry.deletedAt;
    entry.updatedAt=new Date().toISOString();
    persist().then(renderAll);
    toast('已恢复「'+entry.title+'」');
    return;
  }
  if(state.batchMode){
    if(state.selectedIds.has(entry.id)) state.selectedIds.delete(entry.id);
    else state.selectedIds.add(entry.id);
    renderBatchBar(); renderList();
    return;
  }
  const copyBtn=e.target.closest('[data-copyfield]');
  if(copyBtn){
    copyText(entry[copyBtn.dataset.copyfield]||'', ({password:'密码',username:'用户名'})[copyBtn.dataset.copyfield]||'内容');
    return;
  }
  state.selectedId=entry.id;
  renderList(); renderDetail();
  showMobileDetail();
});

function openEntryModal(entry){
  const isNew=!entry;
  const e=entry? JSON.parse(JSON.stringify(entry)) : {title:'',username:'',url:'',password:'',notes:'',tags:[],favorite:false};
  genState={len:16, fmt:'mix', upper:true, lower:true, digits:true, symbols:true, noAmb:true, out:''};
  const ov=openModal(
    '<div class="m-head"><div class="m-title">'+(isNew?'新建条目':'编辑条目')+'</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body">'+
      (isNew?'<label class="flabel" style="margin-top:2px">从模板开始（可选）</label><div class="tpl-row">'+TEMPLATES.map((t,i)=>'<button class="chk" type="button" data-tpl="'+i+'">'+t.label+'</button>').join('')+'</div>':'')+
      '<label class="flabel">名称 <span style="color:var(--err)">*</span></label>'+
      '<input class="input" id="fTitle" placeholder="如：公司 OA 系统" value="'+esc(e.title)+'">'+
      '<label class="flabel">用户名</label>'+
      '<input class="input" id="fUser" placeholder="登录账号 / 工号 / 邮箱" value="'+esc(e.username)+'">'+
      '<label class="flabel">密码 / 密钥</label>'+
      '<div class="input-row">'+
        '<input class="input" id="fPass" type="password" placeholder="密码、API Key、访问令牌…" value="'+esc(e.password)+'">'+
        '<button class="ibtn" data-eye="fPass" title="显示 / 隐藏">'+ICONS.eye+'</button>'+
        '<button class="ibtn" id="btnGenToggle" title="生成密码">'+ICONS.dice+'</button>'+
      '</div>'+
      meterHTML()+
      '<div id="genBox" class="gen-box hidden">'+
        '<div class="gen-out"><code id="genOut">—</code>'+
          '<button class="ibtn" id="btnGenRegen" title="重新生成">'+ICONS.refresh+'</button>'+
          '<button class="btn primary small" id="btnGenUse">使用</button>'+
        '</div>'+
        '<div class="range-row"><span>长度</span><input type="range" id="genLen" min="8" max="64" value="16"><b id="genLenVal">16</b></div>'+
        '<div class="range-row"><span>格式</span><select class="input" id="genFmt" style="flex:1"><option value="mix">混合字符集（登录密码）</option><option value="hex">十六进制（0-9 a-f）</option><option value="b64">Base64URL（签名密钥）</option></select></div>'+
        '<div class="chk-row">'+
          '<label class="chk"><input type="checkbox" id="gUpper" checked>大写字母</label>'+
          '<label class="chk"><input type="checkbox" id="gLower" checked>小写字母</label>'+
          '<label class="chk"><input type="checkbox" id="gDigits" checked>数字</label>'+
          '<label class="chk"><input type="checkbox" id="gSymbols" checked>特殊符号</label>'+
          '<label class="chk"><input type="checkbox" id="gNoAmb" checked>排除易混淆</label>'+
        '</div>'+
      '</div>'+
      '<label class="flabel">网址 / 系统地址</label>'+
      '<input class="input" id="fUrl" placeholder="如 https://oa.company.com（可留空）" value="'+esc(e.url)+'">'+
      '<label class="flabel">分组</label>'+
      '<input class="input" id="fGroup" list="groupList" placeholder="如：工作 / 个人 / 项目A（可留空）" value="'+esc(e.group||'')+'">'+
      '<datalist id="groupList">'+[...new Set(state.vault.entries.filter(x=>!x.deletedAt&&x.group).map(x=>x.group))].map(g=>'<option value="'+esc(g)+'">').join('')+'</datalist>'+
      '<label class="flabel">标签</label>'+
      '<input class="input" id="fTags" placeholder="用空格或逗号分隔，如：办公 邮箱" value="'+esc((e.tags||[]).join(' '))+'">'+
      '<label class="flabel">备注</label>'+
      '<textarea class="input" id="fNotes" placeholder="安全提示问题、绑定手机、申请人等信息">'+esc(e.notes)+'</textarea>'+
      '<label class="flabel">自定义字段 <span style="font-weight:400;color:var(--tx2)">（存放 Region、Secret ID、Endpoint 等附加信息）</span></label>'+
      '<div id="fieldsBox"></div>'+
      '<button class="btn small" id="btnAddField" type="button">'+ICONS.plus+'添加字段</button>'+
      '<label class="chk" style="margin:16px 0 8px"><input type="checkbox" id="fFav"'+(e.favorite?' checked':'')+'>收藏此条目</label>'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="btnSave">保存</button></div>',
    520);

  const root=ov.querySelector('.modal');
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  ov.querySelectorAll('[data-eye]').forEach(b=>{
    b.onclick=()=>{ const inp=root.querySelector('#'+b.dataset.eye);
      const show=inp.type==='password'; inp.type=show?'text':'password';
      b.innerHTML=show?ICONS.eyeOff:ICONS.eye; if(show) inp.focus(); };
  });
  const fPass=root.querySelector('#fPass');
  fPass.addEventListener('input', ()=>updateMeter(root, fPass.value));
  updateMeter(root, e.password);
  root.querySelector('#fTitle').focus();

  /* 生成器 */
  const genBox=root.querySelector('#genBox'), genOut=root.querySelector('#genOut');
  function readGenOpts(){
    genState.len=+root.querySelector('#genLen').value;
    genState.fmt=root.querySelector('#genFmt').value;
    genState.upper=root.querySelector('#gUpper').checked;
    genState.lower=root.querySelector('#gLower').checked;
    genState.digits=root.querySelector('#gDigits').checked;
    genState.symbols=root.querySelector('#gSymbols').checked;
    genState.noAmb=root.querySelector('#gNoAmb').checked;
  }
  function regen(){ readGenOpts(); genState.out=genPassword(genState.len, genState)||'（请至少勾选一种字符）'; genOut.textContent=genState.out; }
  root.querySelector('#btnGenToggle').onclick=()=>{
    genBox.classList.toggle('hidden');
    if(!genBox.classList.contains('hidden')){ regen(); }
  };
  root.querySelector('#btnGenRegen').onclick=regen;
  root.querySelector('#genLen').oninput=function(){ root.querySelector('#genLenVal').textContent=this.value; regen(); };
  root.querySelectorAll('.chk-row input').forEach(c=>c.onchange=regen);
  root.querySelector('#genFmt').onchange=regen;
  root.querySelector('#btnGenUse').onclick=()=>{
    if(genState.out && !genState.out.startsWith('（')){
      fPass.value=genState.out; fPass.type='text';
      updateMeter(root, fPass.value);
      genBox.classList.add('hidden');
      toast('已填入生成的密码');
    }
  };

  /* 自定义字段 */
  const fieldsBox=root.querySelector('#fieldsBox');
  function addFieldRow(f){
    f=f||{name:'',value:'',secret:true};
    const row=document.createElement('div');
    row.className='cf-row';
    row.innerHTML='<input class="input cf-name" placeholder="字段名，如 Region" value="'+esc(f.name)+'">'+
      '<input class="input cf-val" type="'+(f.secret?'password':'text')+'" placeholder="值" value="'+esc(f.value)+'">'+
      '<label class="chk" title="敏感值在详情中默认隐藏"><input type="checkbox" class="cf-sec"'+(f.secret?' checked':'')+'>敏感</label>'+
      '<button class="ibtn cf-del" title="删除字段">'+ICONS.trash+'</button>';
    row.querySelector('.cf-sec').onchange=function(){ row.querySelector('.cf-val').type=this.checked?'password':'text'; };
    row.querySelector('.cf-del').onclick=()=>row.remove();
    fieldsBox.appendChild(row);
  }
  (e.fields||[]).forEach(addFieldRow);
  root.querySelector('#btnAddField').onclick=()=>addFieldRow();
  if(isNew){
    root.querySelectorAll('[data-tpl]').forEach(c=>c.onclick=()=>{
      const t=TEMPLATES[+c.dataset.tpl];
      const title=root.querySelector('#fTitle');
      if(t.defTitle && !title.value.trim()) title.value=t.defTitle;
      root.querySelector('#fUser').value=t.username||'';
      root.querySelector('#fGroup').value=t.group||'';
      fieldsBox.innerHTML='';
      t.fields.forEach(f=>addFieldRow({name:f.name, value:f.value, secret:!!f.secret}));
      toast('已应用「'+t.label+'」模板，补全空着的信息即可');
    });
  }

  root.querySelector('#btnSave').onclick=async()=>{
    /* 会话可能已被失焦锁定/超时锁定：此时绝不能在空数据上静默操作 */
    if(!state.unlocked || !state.vault){ toast('会话已锁定，请重新解锁后再操作', 3200); return; }
    const btn=root.querySelector('#btnSave');
    const title=root.querySelector('#fTitle').value.trim();
    const password=fPass.value;
    if(!title){ toast('请填写名称'); root.querySelector('#fTitle').focus(); return; }
    btn.disabled=true; btn.textContent='保存中…';
    try{
      const tags=[...new Set(root.querySelector('#fTags').value.split(/[,，、\s]+/).map(t=>t.trim()).filter(Boolean))].slice(0,8);
      const fields=[...root.querySelectorAll('.cf-row')].map(r=>({
        name:r.querySelector('.cf-name').value.trim(),
        value:r.querySelector('.cf-val').value,
        secret:r.querySelector('.cf-sec').checked
      })).filter(f=>f.name||f.value);
      const now=new Date().toISOString();
      const group=root.querySelector('#fGroup').value.trim();
      let history=e.history||[];
      if(!isNew && (e.password||'')!==password && password!==''){
        history=[...(e.history||[]), {password:e.password||'', changedAt:e.updatedAt||now}].slice(-10);
      }
      const obj={
        id: e.id||uid(), title, username:root.querySelector('#fUser').value.trim(),
        password, url:root.querySelector('#fUrl').value.trim(),
        group, notes:root.querySelector('#fNotes').value, tags, fields, history,
        favorite:root.querySelector('#fFav').checked,
        createdAt: e.createdAt||now, updatedAt:now
      };
      if(isNew){
        state.vault.entries.push(obj);
        state.selectedId=obj.id;
      }else{
        const i=state.vault.entries.findIndex(x=>x.id===e.id);
        state.vault.entries[i]=obj;
      }
      await persist();
      btn.disabled=false; btn.textContent='保存';
      closeModal(); renderAll();
      toast(isNew?'已添加「'+title+'」':'已保存修改');
    }catch(err){
      btn.disabled=false; btn.textContent='保存';
      toast('保存失败：'+err.message, 4000);
    }
  };
}

/* ---------- Chrome / Edge 密码 CSV 导入 ---------- */
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    }else if(c==='"') inQ=true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); field=''; rows.push(row); row=[]; }
    else if(c!=='\r') field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length && r.some(x=>String(x).trim()!==''));
}
function hostFromUrl(u){
  const s=String(u||'').trim();
  try{ return new URL(s).hostname; }catch(e){}
  return s.replace(/^https?:\/\//i,'').split('/')[0];
}
function chromeCsvToEntries(text){
  const rows=parseCsv(text);
  if(!rows.length) throw new Error('CSV 内容为空');
  const head=rows[0].map(h=>h.trim().toLowerCase());
  let iName=head.indexOf('name'), iUrl=head.indexOf('url'), iUser=head.indexOf('username'), iPass=head.indexOf('password');
  if(iUrl<0 && iUser<0 && iPass<0){ iName=0; iUrl=1; iUser=2; iPass=3; } // 无表头时按 Chrome 固定列序
  const out=[];
  for(const r of rows.slice(1)){
    const get=i=>(i>=0&&i<r.length)?r[i]:'';
    const name=String(get(iName)).trim(), url=String(get(iUrl)).trim();
    const username=String(get(iUser)).trim(), password=String(get(iPass));
    if(!name && !url && !username && !password) continue;
    out.push({name,url,username,password});
  }
  return out;
}
async function importFromCsvText(text){
  const items=chromeCsvToEntries(text);
  if(!items.length){ toast('没有解析到可导入的条目'); return; }
  if(!(await confirmDlg('导入浏览器密码',
    '解析到 '+items.length+' 条账号，将合并进当前保险库：与现有条目重复的（相同网址+用户名）自动跳过，全部打上「浏览器导入」标签方便检查。导入完成后建议删除这份明文 CSV 文件。',
    '导入', false))) return;
  const now=new Date().toISOString();
  let added=0, skipped=0;
  for(const it of items){
    const hasKey=!!(it.url||it.username);
    const dup=hasKey && state.vault.entries.some(x=>(x.url||'')===(it.url||'') && (x.username||'')===(it.username||''));
    if(dup){ skipped++; continue; }
    state.vault.entries.push({
      id:uid(), title: it.name||hostFromUrl(it.url)||'未命名',
      username:it.username, password:it.password, url:it.url,
      notes:'', tags:['浏览器导入'], fields:[], favorite:false,
      createdAt:now, updatedAt:now
    });
    added++;
  }
  await persist(); renderAll();
  toast('导入完成：新增 '+added+' 条'+(skipped?('，跳过重复 '+skipped+' 条'):''), 4200);
}

function bmTagCounts(){ const m={}; for(const b of allBms()) for(const t of (b.tags||[])) m[t]=(m[t]||0)+1; return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh')); }
function normUrl(u){ const t=String(u||'').trim(); if(!t) return ''; try{ const x=new URL(t); let p=x.pathname; if(p.length>1&&p.endsWith('/')) p=p.slice(0,-1); return x.protocol+'//'+x.host.toLowerCase()+p+x.search; }catch(e){ return t.replace(/\/+$/,''); } }

/* ---- Netscape HTML 解析 ---- */
function directChild(el,tag){ for(const c of el.children) if(c.tagName===tag) return c; return null; }
function parseNetscape(html){
  const doc=new DOMParser().parseFromString(html,'text/html');

  const forest={folders:[],bookmarks:[]};

function mkBmFromFile(a,dd){
  const url=(a.getAttribute('href')||'').trim();
  let icon=a.getAttribute('icon')||null;
  if(icon && !/^data:image\//i.test(icon)) icon=null;
  const tags=(a.getAttribute('tags')||'').split(',').map(t=>t.trim()).filter(Boolean);

function mkFolderFromFile(h3){ return {name:(h3.textContent||'').trim()||'未命名文件夹', addDate:ts2ms(h3.getAttribute('add_date')), toolbar:h3.hasAttribute('personal_toolbar_folder'), folders:[], bookmarks:[]}; }
function walkDl(dl,out){
  const kids=Array.from(dl.children);
  const DL_STOP={DT:1,H3:1,A:1};
  const scanSub=from=>{ let j=from; while(j<kids.length){ const t=kids[j].tagName; if(t==='DL') return [j,kids[j]]; if(DL_STOP[t]) return [j,null]; j++; } return [kids.length,null]; };
  const anonFolder=()=>{ const f={name:'未命名文件夹',addDate:0,toolbar:false,folders:[],bookmarks:[]}; out.folders.push(f); return f; };
  for(let i=0;i<kids.length;i++){
    const el=kids[i], tag=el.tagName;
    if(tag==='DT'){
      const h3=directChild(el,'H3'), a=directChild(el,'A'), dd=directChild(el,'DD');
      const innerDl=directChild(el,'DL');
      if(h3){ const f=mkFolderFromFile(h3); out.folders.push(f); if(innerDl) walkDl(innerDl,f); else{ const [j,sub]=scanSub(i+1); if(sub){ walkDl(sub,f); i=j; } } }
      else if(a){ out.bookmarks.push(mkBmFromFile(a,dd)); if(innerDl) walkDl(innerDl,anonFolder()); else{ const [j,sub]=scanSub(i+1); if(sub){ walkDl(sub,anonFolder()); i=j; } } }
      else if(innerDl) walkDl(innerDl,anonFolder());
      else{ const [j,sub]=scanSub(i+1); if(sub){ walkDl(sub,anonFolder()); i=j; } }
    }else if(tag==='H3'){ const f=mkFolderFromFile(el); out.folders.push(f); const [j,sub]=scanSub(i+1); if(sub){ walkDl(sub,f); i=j; } }
    else if(tag==='A') out.bookmarks.push(mkBmFromFile(el,null));
    else if(tag==='DL') walkDl(el,out);
    else if(tag==='DD'){ const last=out.bookmarks[out.bookmarks.length-1]; if(last&&!last.note) last.note=(el.textContent||'').trim(); }
  }
}
function countForestFolders(f){ return f.folders.reduce((n,x)=>n+1+countForestFolders(x),0); }

/* ---- Netscape 导出 ---- */
function exportNetscape(s){
  const L=[];
  const escA=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escT=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sec=ms=>Math.floor((ms||Date.now())/1000);
  const nowSec=sec(Date.now());
  function writeFolder(fid,ind,opts){
    const f=s.folders[fid];
    if(!f||f.deleted) return;
    const attrs=['ADD_DATE="'+sec(f.addDate)+'"','LAST_MODIFIED="'+nowSec+'"'];
    if(opts&&opts.toolbar) attrs.push('PERSONAL_TOOLBAR_FOLDER="true"');
    L.push('\t'.repeat(ind)+'<DT><H3 '+attrs.join(' ')+'>'+escT(f.name)+'</H3>');
    L.push('\t'.repeat(ind)+'<DL><p>');
    for(const cid of (f.children||[])){
      if(s.folders[cid]) writeFolder(cid,ind+1);
      else if(s.bookmarks[cid]&&!s.bookmarks[cid].deleted) writeBm(s.bookmarks[cid],ind+1);
    }
    L.push('\t'.repeat(ind)+'</DL><p>');
  }
  function writeBm(b,ind){
    const attrs=['HREF="'+escA(b.url)+'"','ADD_DATE="'+sec(b.addDate)+'"'];
    if(b.tags&&b.tags.length) attrs.push('TAGS="'+escA(b.tags.join(','))+'"');
    if(b.icon&&/^data:image\//i.test(b.icon)) attrs.push('ICON="'+escA(b.icon)+'"');
    L.push('\t'.repeat(ind)+'<DT><A '+attrs.join(' ')+'>'+escT(b.title)+'</A>');
    if(b.note) L.push('\t'.repeat(ind)+'<DD>'+escT(b.note));
  }
  L.push('<!DOCTYPE NETSCAPE-Bookmark-file-1>');
  L.push('<!-- This is an automatically generated file. DO NOT EDIT! -->');
  L.push('<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">');
  L.push('<TITLE>Bookmarks</TITLE>');
  L.push('<H1>Bookmarks</H1>');
  L.push('<DL><p>');
  writeFolder(s.roots.bar,1,{toolbar:true});
  writeFolder(s.roots.other,1);
  if(s.roots.mobile&&s.folders[s.roots.mobile]) writeFolder(s.roots.mobile,1);
  L.push('</DL><p>');
  return L.join('\n')+'\n';
}

function importStats(forest,existingSet){
  const seen=new Set(); let bms=0,dupExisting=0,dupInFile=0;
  eachForestBm(forest,fb=>{
    if(!fb.url) return;
    bms++;
    const k=normUrl(fb.url);
    if(seen.has(k)){ dupInFile++; return; }
    seen.add(k);
    if(existingSet&&existingSet.has(k)) dupExisting++;
  });
  return {folders:countForestFolders(forest), bms, dupExisting, dupInFile};
}
function importForest(forest,mode,existingSetBefore,fileName){
  let s=state.vault.bookmarks;
  const seen=new Set();
  let added={folders:0,bms:0}, skipped=0;
  const addBm=(fb,parentId)=>{
    if(!fb.url){ skipped++; return; }
    const k=normUrl(fb.url);
    if(!k||seen.has(k)){ skipped++; return; }
    seen.add(k);
    if(mode==='merge'&&existingSetBefore.has(k)){ skipped++; return; }
    const b=mkBm({title:fb.title||hostOf(fb.url), url:fb.url, folderId:parentId, tags:fb.tags, note:fb.note, icon:fb.icon, addDate:fb.addDate||Date.now()});
    b.favorite=!!fb.favorite;
    s.bookmarks[b.id]=b;
    F(parentId).children.push(b.id);
    added.bms++;
  };
  const freshFolder=(ff,parentId)=>{
    const f=mkFolder(ff.name||'未命名文件夹',parentId);
    f.addDate=ff.addDate||Date.now();
    s.folders[f.id]=f;
    F(parentId).children.push(f.id);
    added.folders++;
    return f.id;
  };
  const fillFresh=(ff,fid)=>{
    for(const sub of ff.folders) fillFresh(sub,freshFolder(sub,fid));
    for(const b of ff.bookmarks) addBm(b,fid);
  };
  const mergeInto=(ff,fid)=>{
    let target=null;
    for(const cid of F(fid).children){ const c=F(cid); if(c&&!c.deleted&&c.name===ff.name){ target=c; break; } }
    const tid=target?target.id:freshFolder(ff,fid);
    for(const sub of ff.folders) mergeInto(sub,tid);
    for(const b of ff.bookmarks) addBm(b,tid);
  };
  const rootByKey=key=>{
    if(!s.roots[key]){ const f=mkFolder(key==='mobile'?'移动设备书签':'其他书签',null); s.folders[f.id]=f; s.roots[key]=f.id; }
    return s.roots[key];
  };
  const routeTop=ff=>{
    if(ff.toolbar) return {key:'bar',contents:true};
    if(ff.name==='其他书签') return {key:'other',contents:true};
    if(ff.name==='移动设备书签') return {key:'mobile',contents:true};
    return {key:'other',contents:false};
  };
  if(mode==='replace'){
    const keepBar=s.roots.bar, keepOther=s.roots.other;
    const barF=s.folders[keepBar], otherF=s.folders[keepOther];
    barF.children=[]; otherF.children=[];
    state.vault.bookmarks={app:'BookmarkVault', v:1, updatedAt:new Date().toISOString(), roots:{bar:keepBar, other:keepOther}, folders:{[keepBar]:barF, [keepOther]:otherF}, bookmarks:{}};
    s=state.vault.bookmarks;
    for(const ff of forest.folders){
      const r=routeTop(ff);
      const rid=rootByKey(r.key);
      if(r.contents){ for(const sub of ff.folders) fillFresh(sub,freshFolder(sub,rid)); for(const b of ff.bookmarks) addBm(b,rid); }
      else fillFresh(ff,freshFolder(ff,rid));
    }
    for(const b of forest.bookmarks) addBm(b,rootId('bar'));
  }else if(mode==='newfolder'){
    const nf=mkFolder('导入 · '+(fileName||'书签')+' · '+fmtDate(new Date().toISOString()),rootId('bar'));
    s.folders[nf.id]=nf; F(rootId('bar')).children.push(nf.id); added.folders++;
    for(const ff of forest.folders) fillFresh(ff,freshFolder(ff,nf.id));
    for(const b of forest.bookmarks) addBm(b,nf.id);
  }else{
    for(const ff of forest.folders){
      const r=routeTop(ff);
      const rid=rootByKey(r.key);
      if(r.contents){ for(const sub of ff.folders) mergeInto(sub,rid); for(const b of ff.bookmarks) addBm(b,rid); }
      else mergeInto(ff,rid);
    }
    for(const b of forest.bookmarks) addBm(b,rootId('bar'));
  }
  return added;
}

  state.bm.view=v; state.bm.tag=tag||null;

}
function renderBmSidebar(){
  $('#navAllTxt').textContent='全部书签';
  const s=state.vault.bookmarks;

  const trashN=Object.values(s.bookmarks).filter(b=>b.deleted).length+Object.values(s.folders).filter(f=>f.deleted).length;
  $('#cntAll').textContent=all.length;
  $('#cntFav').textContent=all.filter(b=>b.favorite).length;
  $('#cntTrash').textContent=trashN;
  $('#navAll').classList.toggle('active',state.bm.view==='all');
  $('#navFav').classList.toggle('active',state.bm.view==='fav');
  $('#navTrash').classList.toggle('active',state.bm.view==='trash');

  h+='<div id="navTree">';
  h+=rootFolders().map(([k,f])=>bmTreeItem(f,0)).join('')||'<div style="font-size:12px;color:var(--tx2);padding:2px 12px">无文件夹</div>';
  h+='</div>';
  const tags=bmTagCounts();
  h+='<div class="nav-label">标签</div>';
  h+=tags.length
    ?'<div id="navTagsBm">'+tags.map(([t,n])=>'<button class="tag-item'+(state.bm.view==='tag'&&state.bm.tag===t?' active':'')+'" data-btag="'+esc(t)+'">'+ICONS.tag+'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t)+'</span><span class="cnt">'+n+'</span></button>').join('')+'</div>'
    :'<div style="font-size:12px;color:var(--tx2);padding:2px 12px">暂无标签</div>';
  $('#navBm').innerHTML=h;
  $('#navBm').onclick=e=>{
    const tw=e.target.closest('[data-tw]');
    if(tw){ const id=tw.dataset.tw; state.bm.collapsed.has(id)?state.bm.collapsed.delete(id):state.bm.collapsed.add(id); renderBmSidebar(); return; }
    const tf=e.target.closest('[data-bfolder]');
    if(tf){ bmSetView('folder',tf.dataset.bfolder); return; }
    const tg=e.target.closest('[data-btag]');
    if(tg){ bmSetView('tag',tg.dataset.btag); return; }
    const nv=e.target.closest('[data-bview]');
    if(nv) bmSetView(nv.dataset.bview);
  };
}
function bmTreeItem(f,depth){
  const kids=(f.children||[]).filter(id=>F(id)&&!F(id).deleted);
  const collapsed=state.bm.collapsed.has(f.id);
  const active=state.bm.view==='folder'&&state.bm.folderId===f.id;
  const tw=kids.length?'<span class="tw'+(collapsed?'':' open')+'" data-tw="'+f.id+'">'+ICONS.chev+'</span>':'<span class="tw empty"></span>';
  let h='<div class="tree-item'+(active?' active':'')+'" data-bfolder="'+f.id+'" style="padding-left:'+(8+depth*14)+'px">'
    +tw+ICONS.folder+'<span class="nm">'+esc(f.name)+'</span>'
    +(kids.length?'<span class="cnt">'+kids.length+'</span>':'')+'</div>';
  if(kids.length&&!collapsed) h+='<div class="tree-kids">'+kids.map(c=>bmTreeItem(F(c),depth+1)).join('')+'</div>';
  return h;
}

/* ---- 书签：列表 ---- */
function bmListItems(){
  const s=state.vault.bookmarks;
  const q=(state.bm.q||'').trim().toLowerCase();
  const bmSort=arr=>arr.slice().sort((x,y)=>(y.addDate||0)-(x.addDate||0));
  if(q) return bmSort(allBms().filter(b=>[b.title,b.url,(b.tags||[]).join(' '),b.note].join(' ').toLowerCase().includes(q)));
  const v=state.bm.view;
  if(v==='all') return bmSort(allBms());
  if(v==='fav') return bmSort(allBms().filter(b=>b.favorite));
  if(v==='trash'){
    const dfs=Object.values(s.folders).filter(f=>f.deleted&&(!f.parentId||!F(f.parentId)||F(f.parentId).deleted));
    const dbs=Object.values(s.bookmarks).filter(b=>b.deleted);
    return dfs.concat(dbs);
  }
  if(v==='tag') return bmSort(allBms().filter(b=>(b.tags||[]).includes(state.bm.tag)));
  if(v==='folder'){
    const f=F(state.bm.folderId);
    if(!f) return [];
    return bmSort((f.children||[]).filter(id=>B(id)&&!B(id).deleted).map(id=>B(id)));
  }
  return [];
}

/* ---- 书签：列表交互 ---- */
function bmListClick(e){
  const row=e.target.closest('[data-row]');
  if(!row) return;
  const id=row.dataset.row;
  const openBtn=e.target.closest('[data-bopen]');
  if(openBtn){ const b=B(id); if(b) BMIO.openExternal(b.url); return; }
  const cpBtn=e.target.closest('[data-bcopyurl]');
  if(cpBtn){ const b=B(id); if(b) copyText(b.url,'网址'); return; }
  const rsBtn=e.target.closest('[data-brestore]');
  if(rsBtn){ restoreBm(id); return; }
  const pgBtn=e.target.closest('[data-bpurge]');
  if(pgBtn){ purgeBm(id); return; }
  if(state.batchMode){
    if(state.selectedIds.has(id)) state.selectedIds.delete(id);
    else state.selectedIds.add(id);
    renderBmBatchBar(); renderBmList();
    return;
  }
  if(state.bm.view==='trash') return; // 回收站里的行不响应点击进入
  if(F(id)){ bmSetView('folder',id); return; } // 文件夹行：进入该文件夹
  state.selectedId=id;
  renderBmList(); renderBmDetail();
  showMobileDetail();
}

/* ---- 书签：增删改 ---- */
function openBmModal(bmId){
  const isEdit=!!bmId;
  const b=isEdit?B(bmId):null;
  const defFolder=(state.bm.view==='folder'&&F(state.bm.folderId))?state.bm.folderId:rootId('bar');
  const ov=openModal(
    '<div class="m-head"><div class="m-title">'+(isEdit?'编辑书签':'新建书签')+'</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body">'+
      '<label class="flabel">标题</label>'+
      '<input class="input" id="fbTitle" value="'+esc(isEdit?b.title:'')+'" placeholder="显示名称，留空则使用网址">'+
      '<label class="flabel">网址</label>'+
      '<input class="input mono" id="fbUrl" value="'+esc(isEdit?b.url:'')+'" placeholder="https://…">'+
      '<label class="flabel">文件夹</label>'+
      '<select class="input" id="fbFolder">'+folderOptionsHtml(isEdit?b.folderId:defFolder,null)+'</select>'+
      '<label class="flabel">标签（逗号分隔）</label>'+
      '<input class="input" id="fbTags" value="'+esc(isEdit?(b.tags||[]).join(', '):'')+'" placeholder="工作, 工具, 阅读…">'+
      '<label class="flabel">备注</label>'+
      '<textarea class="input" id="fbNote" placeholder="可选">'+esc(isEdit?b.note:'')+'</textarea>'+
      '<label class="chk" style="margin:16px 0 8px"><input type="checkbox" id="fbFav"'+(isEdit&&b.favorite?' checked':'')+'>收藏（星标）</label>'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="fbSave">保存</button></div>',
    500);
  const root=ov.querySelector('.modal');
  root.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeModal);
  root.querySelector('#fbSave').onclick=async()=>{
    const title=root.querySelector('#fbTitle').value.trim();
    const url=normalizeUrlInput(root.querySelector('#fbUrl').value);
    if(!url){ toast('请填写网址'); return; }
    if(!isHttpUrl(url)&&!/^(javascript:|file:|chrome:|edge:|about:)/i.test(url)){ toast('网址格式不正确（支持 http/https）'); return; }
    const tags=root.querySelector('#fbTags').value.split(/[,，]/).map(t=>t.trim()).filter(Boolean).slice(0,8);
    const note=root.querySelector('#fbNote').value;
    const fav=root.querySelector('#fbFav').checked;
    const fid=root.querySelector('#fbFolder').value;
    const now=Date.now();
    if(isEdit){
      const old=b.folderId;
      Object.assign(b,{title,url,tags,note,favorite:fav});
      if(fid!==old){ detachChild(b.id); b.folderId=fid; F(fid).children.push(b.id); }
      state.selectedId=b.id;
    }else{
      const nb=mkBm({title,url,folderId:fid,tags,note});
      nb.favorite=fav;
      state.vault.bookmarks.bookmarks[nb.id]=nb;
      F(fid).children.push(nb.id);
      if(state.bm.view==='folder'&&state.bm.folderId!==fid) bmSetView('folder',fid);
      state.selectedId=nb.id;
    }
    await persist(); closeModal(); renderAll();
    toast(isEdit?'已保存书签':'已添加书签');
  };
}
function delBm(id){
  const b=B(id); if(!b) return;
  b.deleted=true;
  if(state.selectedId===id) state.selectedId=null;
  state.selectedIds.delete(id);
  persist().then(renderAll);
  toast('已移入回收站「'+(b.title||hostOf(b.url))+'」');
}
function restoreBm(id){
  const b=B(id); if(!b) return;
  b.deleted=false;
  const f=F(b.folderId);
  if(!f||f.deleted){ detachChild(id); b.folderId=rootId('bar'); F(rootId('bar')).children.push(id); }
  persist().then(renderAll); toast('已恢复书签');
}
function purgeBm(id){
  detachChild(id); delete state.vault.bookmarks.bookmarks[id];
  if(state.selectedId===id) state.selectedId=null;
  persist().then(renderAll);
}
function delFolderDlg(fid){
  const f=F(fid); if(!f) return;
  const n=countBmsIn(fid);
  confirmDlg('删除文件夹','将删除文件夹「'+f.name+'」及其内部的 '+n+' 条书签，内容会移入回收站，可随时恢复。','删除',true)
    .then(async ok=>{
      if(!ok) return;
      f.deleted=true;
      if(state.bm.view==='folder'&&state.bm.folderId===fid) bmSetView('all'); else renderAll();
      await persist();
      toast('文件夹已移入回收站');
    });
}
function restoreFolder(id){
  const f=F(id); if(!f) return;
  f.deleted=false;
  let cur=f, g=0;
  while(cur.parentId&&g++<60){ const p=F(cur.parentId); if(!p||!p.deleted) break; p.deleted=false; cur=p; }
  if(cur.parentId&&!F(cur.parentId)){ cur.parentId=rootId('other'); F(rootId('other')).children.push(cur.id); }
  persist().then(renderAll); toast('文件夹已恢复');
}
function purgeFolder(id){
  const f=F(id); if(!f) return;
  detachChild(id);
  const eat=fid=>{
    const ff=F(fid); if(!ff) return;
    for(const cid of (ff.children||[])){
      if(state.vault.bookmarks.bookmarks[cid]) delete state.vault.bookmarks.bookmarks[cid];
      else eat(cid);
    }
    delete state.vault.bookmarks.folders[fid];
  };
  eat(id);
  ['bar','other','mobile'].forEach(k=>{ if(state.vault.bookmarks.roots[k]===id) delete state.vault.bookmarks.roots[k]; });
  if(state.bm.view==='folder'&&state.bm.folderId===id) state.bm.view='all';
  persist().then(renderAll);
}
function emptyBmTrashDlg(){
  const n=Object.values(state.vault.bookmarks.bookmarks).filter(b=>b.deleted).length
    +Object.values(state.vault.bookmarks.folders).filter(f=>f.deleted).length;
  confirmDlg('清空回收站','将彻底删除回收站里的所有书签和文件夹（含文件夹内书签），此操作不可恢复。','清空',true)
    .then(async ok=>{
      if(!ok) return;
      Object.values(state.vault.bookmarks.folders).filter(f=>f.deleted).forEach(f=>purgeFolder(f.id));
      Object.values(state.vault.bookmarks.bookmarks).filter(b=>b.deleted).forEach(b=>purgeBm(b.id));
      await persist(); renderAll(); toast('回收站已清空');
    });
}

/* ---- 书签：文件夹与移动 ---- */
function moveTargets(excludeFid){
  const out=[];
  const walk=(fid,depth)=>{
    const f=F(fid); if(!f||f.deleted) return;
    out.push({id:fid,name:f.name,depth});
    for(const cid of childFolders(fid)){
      if(excludeFid&&(cid===excludeFid||isDescendantOf(cid,excludeFid))) continue;
      walk(cid,depth+1);
    }
  };
  for(const [,rf] of rootFolders()){
    if(excludeFid&&(rf.id===excludeFid||isDescendantOf(rf.id,excludeFid))) continue;
    walk(rf.id,0);
  }
  return out;
}
function folderOptionsHtml(selFid,excludeFid){
  return moveTargets(excludeFid).map(o=>
    '<option value="'+o.id+'"'+(o.id===selFid?' selected':'')+'>'+('&nbsp;'.repeat(o.depth*4))+esc(o.name)+'</option>').join('');
}
function openFolderModal(parentId,renameId){
  const isRename=!!renameId;
  const f=isRename?F(renameId):null;
  const defParent=parentId||(state.bm.view==='folder'?state.bm.folderId:rootId('bar'));
  const ov=openModal(
    '<div class="m-head"><div class="m-title">'+(isRename?'重命名文件夹':'新建文件夹')+'</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body">'+
      (isRename?'':'<label class="flabel">位置</label><select class="input" id="fdParent">'+folderOptionsHtml(defParent,null)+'</select>')+
      '<label class="flabel">名称</label><input class="input" id="fdName" value="'+esc(isRename?f.name:'')+'" placeholder="文件夹名称">'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="fdOk">'+(isRename?'保存':'创建')+'</button></div>',
    420);
  ov.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeModal);
  ov.querySelector('#fdName').focus();
  ov.querySelector('#fdOk').onclick=async()=>{
    const name=ov.querySelector('#fdName').value.trim();
    if(!name){ toast('请填写名称'); return; }
    if(isRename){ f.name=name; toast('已重命名'); }
    else{
      const pid=ov.querySelector('#fdParent').value;
      const nf=mkFolder(name,pid);
      state.vault.bookmarks.folders[nf.id]=nf; F(pid).children.push(nf.id);
      toast('文件夹已创建');
    }
    await persist(); closeModal(); renderAll();
  };
}
function openMoveModal(bmIds){
  const ids=bmIds.slice();
  if(!ids.length) return;
  const targets=moveTargets(null);
  if(!targets.length){ toast('没有可选的目标文件夹'); return; }
  const ov=openModal(
    '<div class="m-head"><div class="m-title">移动到…</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body"><p style="color:var(--tx1);font-size:12.5px">已选择 '+ids.length+' 项，点击目标文件夹后确认。</p>'+
      '<div id="mvTree" style="max-height:300px;overflow-y:auto;margin-top:6px">'+targets.map(o=>
        '<div class="tree-item" data-mv="'+o.id+'" style="padding-left:'+(9+o.depth*16)+'px">'+ICONS.folder+esc(o.name)+'</div>').join('')+'</div></div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="mvOk">移动</button></div>',
    430);
  ov.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeModal);
  let target=targets[0].id;
  const mark=()=>{ ov.querySelectorAll('[data-mv]').forEach(el=>el.classList.toggle('active',el.dataset.mv===target)); };
  mark();
  ov.querySelector('#mvTree').onclick=e=>{
    const el=e.target.closest('[data-mv]'); if(!el) return;
    target=el.dataset.mv; mark();
  };
  ov.querySelector('#mvOk').onclick=()=>{
    let n=0;
    for(const id of ids){
      const b=B(id);
      if(b&&!b.deleted){
        if(b.folderId===target) continue;
        detachChild(id); b.folderId=target; F(target).children.push(id); n++;
      }else{
        const f=F(id);
        if(f&&!f.deleted&&f.parentId!==null&&f.id!==target&&!isDescendantOf(target,id)){
          detachChild(id); f.parentId=target; F(target).children.push(id); n++;
        }
      }
    }
    closeModal(); persist().then(renderAll);
    toast(n?('已移动 '+n+' 项'):'所选项目已在该文件夹中');
  };
}

/* ---- 书签：批量 ---- */
function renderBmBatchBar(){
  const bar=$('#batchBar');
  if(!state.batchMode){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  bar.classList.remove('hidden');
  const trashView=state.bm.view==='trash';
  bar.innerHTML='<span>已选 <b>'+state.selectedIds.size+'</b> 项</span>'+
    '<button class="btn small" id="bSelAll">全选当前</button>'+
    (trashView?'<button class="btn small" id="bRestoreSel">'+ICONS.restore+'恢复所选</button><button class="btn small danger" id="bDelSel">'+ICONS.trash+'彻底删除</button>'
              :'<button class="btn small" id="bMoveSel">'+ICONS.folder+'移动到…</button><button class="btn small danger" id="bDelSel">'+ICONS.trash+'删除所选</button>')+
    '<button class="btn small" id="bExitSel">完成</button>';
  $('#bSelAll').onclick=()=>{ bmListItems().forEach(x=>state.selectedIds.add(x.id)); renderBmBatchBar(); renderBmList(); };
  $('#bDelSel').onclick=bmBatchDelete;
  $('#bExitSel').onclick=()=>{ state.batchMode=false; state.selectedIds.clear(); renderAll(); };
  const rs=$('#bRestoreSel'); if(rs) rs.onclick=bmBatchRestore;
  const mv=$('#bMoveSel'); if(mv) mv.onclick=()=>openMoveModal([...state.selectedIds]);
}
async function bmBatchDelete(){
  const n=state.selectedIds.size;
  if(!n){ toast('请先勾选要操作的项目'); return; }
  if(state.bm.view==='trash'){
    if(!(await confirmDlg('彻底删除','确定将选中的 '+n+' 项彻底删除吗？此操作不可恢复。','彻底删除',true))) return;
    for(const id of state.selectedIds){
      if(B(id)) purgeBm(id);
      else if(F(id)) purgeFolder(id);
    }
    state.selectedIds.clear(); state.batchMode=false;
    await persist(); renderAll();
    toast('已彻底删除 '+n+' 项');
  }else{
    for(const id of state.selectedIds){
      const b=B(id); if(b&&!b.deleted) b.deleted=true;
      const f=F(id); if(f&&!f.deleted) f.deleted=true;
    }
    state.selectedIds.clear(); state.batchMode=false;
    await persist(); renderAll();
    toast('已移入回收站 '+n+' 项');
  }
}
async function bmBatchRestore(){
  const n=state.selectedIds.size;
  if(!n){ toast('请先勾选要恢复的项目'); return; }
  for(const id of state.selectedIds){
    if(B(id)) restoreBm(id);
    else if(F(id)) restoreFolder(id);
  }
  state.selectedIds.clear(); state.batchMode=false;
  await persist(); renderAll();
  toast('已恢复 '+n+' 项');
}

/* ---- 书签：Netscape 导入导出 ---- */
async function bmStartImport(){
  let file;
  try{ file=await BMIO.readImportFile(); }catch(e){ toast('读取文件失败：'+e.message); return; }
  if(!file) return;
  let forest;
  try{ forest=parseNetscape(file.text); }
  catch(e){ toast(e.message); return; }
  const st=importStats(forest,urlSetOf(state.vault.bookmarks));
  const baseName=file.name.replace(/\.html?$/i,'');
  const ov=openModal(
    '<div class="m-head"><div class="m-title">导入书签</div><button class="ibtn" data-x>'+ICONS.x+'</button></div>'+
    '<div class="m-body">'+
      '<p style="color:var(--tx1);font-size:12.5px">'+esc(file.name)+' — 共 '+st.folders+' 个文件夹、'+st.bms+' 条书签'+(st.dupInFile?'（文件内重复 '+st.dupInFile+' 条）':'')+'。</p>'+
      '<div class="chk-row" style="margin-top:10px" id="iwModes">'+
        '<label class="chk"><input type="radio" name="iwMode" value="merge" checked>合并去重（推荐）</label>'+
        '<label class="chk"><input type="radio" name="iwMode" value="newfolder">导入到新文件夹</label>'+
        '<label class="chk"><input type="radio" name="iwMode" value="replace">替换整个书签库</label>'+
      '</div>'+
      '<p style="color:var(--tx2);font-size:11.5px;margin-top:8px;line-height:1.7">合并：网址相同的跳过，同名文件夹并入现有文件夹。<br>替换：清空当前书签库后重新导入。</p>'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-x>取消</button><button class="btn primary" id="iwOk">开始导入</button></div>',
    500);
  ov.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeModal);
  ov.querySelector('#iwOk').onclick=async()=>{
    const mode=ov.querySelector('input[name="iwMode"]:checked').value;
    if(mode==='replace' && !(await confirmDlg('确认替换','当前书签库将被完全覆盖。','替换',true))) return;
    const res=importForest(forest,mode,urlSetOf(state.vault.bookmarks),baseName);
    await persist(); renderAll(); closeModal();
    toast('导入完成：新增 '+res.bms+' 条书签、'+res.folders+' 个文件夹', 4200);
  };
}
async function bmExportHtml(){
  const n=allBms().length;
  if(!n){ toast('书签库是空的，没有可导出的内容'); return; }
  const text=exportNetscape(state.vault.bookmarks);
  const ok=await BMIO.saveHtml('Chrome书签_'+fmtDate(new Date().toISOString())+'.html', text);
  if(ok) toast('已导出 '+n+' 条书签');
}

/* ---- 书签：旧书签库迁移 ---- */
function storeToForest(s){
  const forest={folders:[],bookmarks:[]};
  const walk=(fid,out)=>{
    const f=s.folders[fid]; if(!f) return;
    for(const cid of (f.children||[])){
      if(s.bookmarks[cid]){
        const b=s.bookmarks[cid];
        if(!b.deleted) out.bookmarks.push({title:b.title,url:b.url,tags:b.tags||[],note:b.note||'',icon:b.icon||null,addDate:b.addDate,favorite:!!b.favorite});
      }else{
        const c=s.folders[cid];
        if(c&&!c.deleted){ const nf={name:c.name,addDate:c.addDate,toolbar:false,folders:[],bookmarks:[]}; out.folders.push(nf); walk(cid,nf); }
      }
    }
  };
  ['bar','other','mobile'].forEach(k=>{ if(s.roots&&s.roots[k]&&s.folders[s.roots[k]]) walk(s.roots[k],forest); });
  return forest;
}
async function openMigrateStore(){
  let f;
  try{ f=await BMIO.openStoreFile(); }catch(e){ toast('读取失败：'+e.message); return; }
  if(!f) return;
  try{
    let raw=JSON.parse(f.text);
    const store=(raw&&raw.data&&raw.data.roots)?raw.data:raw;
    if(!store||!store.roots||!store.folders||!store.bookmarks) throw new Error('不是有效的书签库文件');
    const forest=storeToForest(store);
    if(!countForestBms(forest)&&!countForestFolders(forest)) throw new Error('这个书签库是空的');
    const st=importStats(forest,urlSetOf(state.vault.bookmarks));
    if(!(await confirmDlg('导入旧书签库','解析到 '+st.bms+' 条书签、'+st.folders+' 个文件夹（与现有重复 '+st.dupExisting+' 条会跳过），将合并到书签区。确定导入？','导入',false))) return;
    const res=importForest(forest,'merge',urlSetOf(state.vault.bookmarks),'旧书签库');
    await persist(); renderAll();
    toast('迁移完成：新增 '+res.bms+' 条书签、'+res.folders+' 个文件夹', 4600);
  }catch(e){ toast('导入失败：'+e.message); }
}

/* ---- 类型页签 ---- */
$('#tabPw').onclick=()=>setType('pw');
$('#tabBm').onclick=()=>setType('bm');
function setType(t){
  if(state.type===t) return;
  state.type=t;
  state.selectedId=null; state.selectedIds.clear(); state.batchMode=false;
  state.filter={view:'all',tag:null,q:''};
  state.bm.view='all'; state.bm.tag=null; state.bm.folderId=null; state.bm.q='';
  $('#searchInput').value='';
  $('#searchInput').placeholder=t==='bm'?'搜索书签 / 网址 / 标签…　Ctrl+K':'搜索名称 / 用户名 / 备注…　Ctrl+K';
  $('#tabPw').classList.toggle('active',t==='pw');
  $('#tabBm').classList.toggle('active',t==='bm');
  closeMobileDetail();
  renderAll();
}

/* ---- 移动端：抽屉与全屏详情 ---- */
function isMobileLayout(){ return window.matchMedia('(max-width:860px)').matches; }
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#drawerBackdrop').classList.remove('show'); }
function toggleDrawer(){
  const open=!$('#sidebar').classList.contains('open');
  $('#sidebar').classList.toggle('open',open);
  $('#drawerBackdrop').classList.toggle('show',open);
}
function showMobileDetail(){ if(isMobileLayout()) $('#detailPane').classList.add('show'); }
function closeMobileDetail(){ $('#detailPane').classList.remove('show'); }
$('#btnMenu').onclick=toggleDrawer;
$('#drawerBackdrop').onclick=closeDrawer;
$('#btnMLock').onclick=()=>{ closeDrawer(); lockNow(); };
window.addEventListener('resize', ()=>{ if(!isMobileLayout()){ closeDrawer(); closeMobileDetail(); } });

/* ================================================================
 * 启动
 * ================================================================ */
(async function init(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      state.blob=JSON.parse(raw);
      if(!state.blob.salt) state.blob=null;
    }
  }catch(e){ state.blob=null; }
  try{ fileHandle=(await idbGet('handle'))||null; }catch(e){ fileHandle=null; }
  renderLock();
})();
</script>
